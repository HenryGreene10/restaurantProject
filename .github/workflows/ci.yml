name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # --max-warnings=0 once Sprint 3 clears the set-state-in-effect/exhaustive-deps warnings
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: restaurant_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/restaurant_ci

      - name: Check for schema drift
        # Fails if schema.prisma has changes not captured in a migration file.
        run: >
          npx prisma migrate diff
          --from-url postgresql://postgres:test@localhost:5432/restaurant_ci
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/restaurant_ci
